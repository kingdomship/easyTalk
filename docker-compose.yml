services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: emotion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emotion"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-${DEEPSEEK_API_KEY}}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=emotion
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-123456}
    dns:
      - 223.5.5.5
      - 114.114.114.114
    volumes:
      - /home/xuwl/app/easytalk/memory:/app/memory
      - /home/xuwl/app/easytalk/ssl:/app/ssl:ro
    command:
      - python3
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --ssl-keyfile
      - /app/ssl/key.pem
      - --ssl-certfile
      - /app/ssl/cert.pem
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, ssl; urllib.request.urlopen('https://localhost:8443/', context=ssl._create_unverified_context())\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
